[project]
name = "aidd-chat"
version = "0.1.0"
description = "Anonymous Korean Q&A conversation shell"
requires-python = "==3.12.14"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "tokenizers>=0.23.2",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "httpx2==2.12.0",
    "playwright==1.62.0",
    "pytest==9.0.2",
]

[tool.uv]
required-version = "==0.12.5"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidd_chat"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/uv.lock", "/.python-version"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Story 1.11's Release Test Suite: nine items, eight of which Stories 1.3-1.9 already
# proved. Selected with `-m release_suite` rather than re-written, so there is only
# ever one battery. tests/test_story_1_11.py pins which tests carry it.
markers = [
    "release_suite: Story 1.11 Release Test Suite item",
]
# --strict-markers, because the Suite is SELECTED by a Marker: an unregistered or
# mistyped one would otherwise register silently and `-m release_suite` would quietly
# run fewer items than the evidence claims.
addopts = "--strict-markers"
