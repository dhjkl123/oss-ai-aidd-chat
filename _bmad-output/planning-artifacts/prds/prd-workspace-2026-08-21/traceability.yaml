nfrs:
  NFR-1:
    title: Warm 상태 2초 내 실행 상태 표시, 최종 답변 p50 15초·p95 45초
    status: ready-for-dev
  NFR-2:
    title: 120초 초과 시 Timeout 종료와 안전한 재시도, 부분 출력은 완료 답변 불가
    status: ready-for-dev
  NFR-3:
    title: 재시도와 Network Reconnect가 완료 답변을 중복으로 만들지 않음
    status: ready-for-dev
  NFR-4:
    title: Provider Credential과 Secret을 Client·응답·Log에 노출하지 않음
    status: ready-for-dev
  NFR-5:
    title: Prompt·답변·도구 인자·Wiki 본문·CoT를 운영 Log에 남기지 않고 대화를 영구 저장하지 않음
    status: ready-for-dev
  NFR-6:
    title: 외부 Provider 사용 시 Wiki 내용 전송 사실과 Provider 정보 고지
    status: ready-for-dev
  NFR-11:
    title: Wiki 루트 안 읽기로만 제한하고 경로 탈출(.., Symlink) 차단
    status: ready-for-dev
  NFR-7:
    title: Keyboard만으로 핵심 흐름 수행, 상태·contested를 색상만으로 전달하지 않음
    status: ready-for-dev
  NFR-8:
    title: 320 CSS px·200% Zoom·Reduced Motion 지원, 진행 단계는 단계 변경 시에만 Live Region 알림
    status: ready-for-dev
  NFR-9:
    title: 운영 관측 정보는 Correlation ID·단계·Step 수·도구 이름·지연·상태·오류 유형으로 제한
    status: ready-for-dev
  NFR-10:
    title: Runtime·Model Provider 교체에도 Web·API 계약 불변, 진행 단계·근거는 추가 필드로 확장
    status: ready-for-dev
  NFR-12:
    title: 기존 소스 구조와 테스트 자산 최대 유지, 에이전트 도입은 Model 호출 계층 교체로 제한
    status: ready-for-dev
